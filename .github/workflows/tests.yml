# Runs the test suite on macOS, Windows, and Linux for every push to main and
# every pull request. Free for public repositories.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Rater tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Install NumPy
        run: python -m pip install -r ml-recommender/requirements.txt
      - name: All tests, recommender included
        run: python -m unittest discover -s tests -v
      - name: Self-test from source
        run: python app/launch.py --selftest
