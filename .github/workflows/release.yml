# Builds the ready-to-run downloads and drafts a GitHub Release.
#
#   1. bump VERSION in tastebuds.py (e.g. "1.0.1"), commit, push
#   2. git tag v1.0.1 && git push origin v1.0.1
#   3. wait for this workflow, then open Releases, check the draft, Publish
#
# "Run workflow" on the Actions tab does a dry run: same builds and checks,
# downloads attached to the run, no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (macos-14 was retired Nov 2026)
            label: mac
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the version
        shell: bash
        run: |
          VER=$(python -c "import re; print(re.search(r'^VERSION = \"([^\"]+)\"', open('tastebuds.py', encoding='utf-8').read(), re.M).group(1))")
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VER in tastebuds.py"; exit 1
          fi

      - name: Tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml-recommender/requirements.txt
          python -m unittest discover -s tests

      - name: Build tools
        shell: bash
        run: python -m pip install pyinstaller pywebview

      - name: NumPy for older macOS
        if: runner.os == 'macOS'
        shell: bash
        # The default arm64 NumPy wheel needs macOS 14; the macOS 11 wheel keeps
        # the app running on macOS 12 and 13 too.
        run: |
          if python -m pip download numpy --only-binary=:all: --no-deps \
               --platform macosx_11_0_arm64 --python-version 3.12 -d wheels; then
            python -m pip install --force-reinstall --no-deps wheels/numpy-*.whl
          else
            echo "::warning::No macOS 11 NumPy wheel found; the app will need macOS 14+"
          fi

      - name: Icons
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            iconutil -c icns assets/icon.iconset -o assets/icon.icns
          else
            python assets/make_ico.py
          fi

      - name: Build the app
        shell: bash
        working-directory: app
        run: pyinstaller --noconfirm tastebuds.spec --distpath ../dist --workpath ../build

      # ---------------- macOS ----------------
      - name: Seal the app (ad-hoc signature)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/Tastebuds.app
          codesign --verify --deep --strict dist/Tastebuds.app

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          code=0
          TASTEBUDS_SELFTEST_REPORT="$RUNNER_TEMP/selftest.txt" \
            dist/Tastebuds.app/Contents/MacOS/Tastebuds --selftest || code=$?
          cat "$RUNNER_TEMP/selftest.txt" || true
          exit $code

      - name: Disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          ditto dist/Tastebuds.app dmg/Tastebuds.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Tastebuds" -srcfolder dmg -ov -format UDZO \
            "dist/Tastebuds-$VER-mac-AppleSilicon.dmg"

      # ---------------- Windows ----------------
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TASTEBUDS_SELFTEST_REPORT = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "dist\Tastebuds\Tastebuds.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content $env:TASTEBUDS_SELFTEST_REPORT -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" installer\windows\tastebuds.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v6
        with:
          name: tastebuds-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/TastebudsSetup-*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          cat > notes.md <<NOTES
          **Download:** the \`.dmg\` for a Mac with Apple Silicon (M1 or newer), the \`Setup\` \`.exe\` for Windows 10/11.

          These builds are not signed, so the first launch shows a one-time warning. Step-by-step help, with what to click: [INSTALL.md](https://github.com/$GITHUB_REPOSITORY/blob/main/INSTALL.md).
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft \
              --title "Tastebuds ${TAG#v}" --notes-file notes.md
          fi
